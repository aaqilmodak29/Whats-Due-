# Builds a signed APK and publishes it as a GitHub Release.
#
# Triggered by a version tag, so cutting a release is:
#
#     git tag v1.1.0 && git push origin v1.1.0
#
# The app polls this repository's latest release and offers to install it, so
# this workflow is the whole update mechanism — nothing has to be copied to the
# phone by hand.
#
# Two things have to line up for an update to actually install:
#
#   * the APK must be signed with the same key as the installed app, hence the
#     keystore secrets rather than Flutter's per-machine debug key
#   * versionCode must increase, which is why build-number comes from the run
#     number rather than pubspec
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to build, e.g. v1.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # v1.1.0 -> 1.1.0, which is what package_info reports at runtime and
          # what the in-app updater compares against.
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.3
          channel: stable
          cache: true

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A debug-signed APK cannot update an installed release, so this build would produce something nobody can install."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android-release.keystore
          cat > app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=whatsdue
          storeFile=../../../android-release.keystore
          EOF

      - name: Restore the Firebase config
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DATABASE_ID: ${{ secrets.FIREBASE_DATABASE_ID }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "::warning::Firebase secrets are not set. Releasing with sync disabled."
          fi
          {
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            echo "FIREBASE_API_KEY=$FIREBASE_API_KEY"
            echo "FIREBASE_DATABASE_ID=${FIREBASE_DATABASE_ID:-(default)}"
          } > .env

      - name: Verify before shipping
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          # Goldens are excluded: they compare font rasterisation and were
          # captured on Windows, so they differ on a Linux runner.
          flutter test \
            test/logic_test.dart \
            test/store_test.dart \
            test/sync_test.dart \
            test/manifest_test.dart \
            test/reminder_schedule_test.dart \
            test/ui_test.dart

      - name: Build
        working-directory: app
        run: |
          flutter build apk --release \
            --dart-define-from-file=../.env \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ github.run_number }}

      - name: Name the artifact after its version
        run: |
          mv app/build/app/outputs/flutter-apk/app-release.apk \
             whats-due-${{ steps.version.outputs.tag }}.apk
          ls -la whats-due-*.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: whats-due-${{ steps.version.outputs.tag }}.apk
