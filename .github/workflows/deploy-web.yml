# Builds the site GitHub Pages serves, and deploys it.
#
# Pages used to serve the `main` branch root directly, which meant the Flutter
# web build had to be compiled locally and committed — ~180k lines of generated
# CanvasKit payload, rebuilt and re-committed on every change. This builds it on
# push instead, so the repository holds only source.
#
# The assembled site keeps both apps at the paths they already live at:
#
#   /Whats-Due-/               the original single-file app  (index.html)
#   /Whats-Due-/flutter-web/   the Flutter build
#
# index.html is copied verbatim. It is the live app holding real assignments,
# and nothing here rewrites or regenerates it.
name: Deploy to Pages

on:
  push:
    branches: [main]
  # Lets the site be redeployed from the Actions tab without a code change,
  # which is how the first deploy gets triggered after the Pages source is
  # switched over to Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a merge landing while
# another deploy runs still ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this was developed against, so a future
          # Flutter release cannot silently change the output.
          flutter-version: 3.38.3
          channel: stable
          cache: true

      - name: Verify the app still builds and passes its tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          # Everything except the goldens, which compare font rasterisation and
          # so differ between the Windows machine that generated them and this
          # Linux runner. `--exclude-tags` would need tagging every test, so the
          # one file is named directly.
          flutter test \
            test/logic_test.dart \
            test/store_test.dart \
            test/sync_test.dart \
            test/ui_test.dart

      # The Firebase values are not in the repository, so CI takes them from
      # repository secrets. Without them the deployed web app still builds and
      # runs — it just reports sync as switched off, which would be a confusing
      # way to discover the secrets are missing, hence the explicit warning.
      - name: Assemble the build config
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DATABASE_ID: ${{ secrets.FIREBASE_DATABASE_ID }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$FIREBASE_API_KEY" ]; then
            echo "::warning::FIREBASE_PROJECT_ID / FIREBASE_API_KEY are not set as repository secrets. Deploying with sync disabled."
          fi
          {
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            echo "FIREBASE_API_KEY=$FIREBASE_API_KEY"
            echo "FIREBASE_DATABASE_ID=${FIREBASE_DATABASE_ID:-(default)}"
          } > app/.env

      - name: Build web
        working-directory: app
        run: |
          flutter build web --release \
            --base-href /Whats-Due-/flutter-web/ \
            --dart-define-from-file=.env

      - name: Assemble the site
        run: |
          mkdir -p _site/flutter-web
          cp index.html _site/index.html
          cp -r app/build/web/. _site/flutter-web/
          test -f _site/index.html
          test -f _site/flutter-web/main.dart.js
          test -f _site/flutter-web/assets/assets/fonts/Inter-Variable.ttf
          echo "assembled $(find _site -type f | wc -l) files"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
